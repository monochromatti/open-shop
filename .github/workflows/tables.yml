name: Table benchmarks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: normal-2h
            hours: 2
            start: '2024-09-01T00:00:00Z'
            seconds: 60
          - name: normal-6h
            hours: 6
            start: '2024-09-01T00:00:00Z'
            seconds: 120
          - name: normal-24h
            hours: 24
            start: '2024-09-01T00:00:00Z'
            seconds: 120
          - name: seasonal-24h
            hours: 24
            start: '2024-09-29T12:00:00Z'
            seconds: 120
    env:
      JULIA_NUM_THREADS: 1
      JULIA_NUM_PRECOMPILE_TASKS: 2
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: '1.13'
      - uses: julia-actions/cache@v3.4.0
        with:
          delete-old-caches: false
      - name: Instantiate
        run: julia --pkgimages=no --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Fetch and reconstruct external benchmark data
        run: |
          python3 -m pip install PyYAML
          python3 examples/tokke_vinje/fetch.py
          python3 examples/tokke_vinje/import.py --hours ${{ matrix.hours }} --start '${{ matrix.start }}' --output results/inputs
      - name: Compare exact table graphs
        run: julia --pkgimages=no --project=. benchmark/hosted_tables.jl results/inputs/tokke_vinje_${{ matrix.hours }}h.json results/comparison ${{ matrix.seconds }}
      - name: Upload scalar measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tables-${{ matrix.name }}
          path: results/comparison/summary.json
          if-no-files-found: warn
