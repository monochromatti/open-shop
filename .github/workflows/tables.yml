name: Table representation contest
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        case: [operating-2h, pchip]
    env:
      JULIA_NUM_THREADS: 1
      JULIA_NUM_PRECOMPILE_TASKS: 2
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: '1.13'
      - uses: julia-actions/cache@v3.4.0
        with:
          delete-old-caches: false
      - name: Instantiate
        run: julia --pkgimages=no --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Construct operating case
        if: matrix.case == 'operating-2h'
        run: |
          python3 -m pip install PyYAML
          python3 examples/tokke_vinje/fetch.py
          python3 examples/tokke_vinje/import.py --hours 2 --output results/inputs
      - name: Screen operating table graphs
        if: matrix.case == 'operating-2h'
        run: julia --pkgimages=no --project=. benchmark/contest.jl results/inputs/tokke_vinje_2h.json results/contest screen 60
      - name: Screen warm and cold PCHIP at two gap targets
        if: matrix.case == 'pchip'
        run: julia --pkgimages=no --project=. benchmark/contest.jl benchmark/cases/turbine-tables.json results/contest synthetic 30
      - name: Upload scalar measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contest-${{ matrix.case }}
          path: results/contest/summary.json
          if-no-files-found: warn
