name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      JULIA_NUM_THREADS: 1
      JULIA_NUM_PRECOMPILE_TASKS: 2
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: '1.13'
      - uses: julia-actions/cache@v3.4.0
        with:
          delete-old-caches: false
      - name: Instantiate and test
        run: julia --pkgimages=no --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test(; julia_args=["--pkgimages=no"])'
      - name: Test the dataset importer
        run: python3 -m unittest discover -s examples/tokke_vinje -p "test_*.py"
      - name: Test proof evidence analysis
        run: python3 -m unittest discover -s benchmark -p root_proof_summary_tests.py
      - name: Run the public example
        run: julia --pkgimages=no --project=. examples/single_reservoir.jl
