name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  JULIA_NUM_THREADS: 1
  JULIA_NUM_PRECOMPILE_TASKS: 2
  OPENBLAS_NUM_THREADS: 1
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: '1.13'
      - uses: julia-actions/cache@v3.4.0
        with:
          delete-old-caches: false
      - name: Instantiate and test
        run: julia --pkgimages=no --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test(; julia_args=["--pkgimages=no"])'
      - name: Test the dataset importer
        run: python3 -m unittest discover -s examples/tokke_vinje -p "test_*.py"
      - name: Test the long-run supervisor
        run: python3 -m unittest discover -s test -p "test_fuzz_runner.py"
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [hydraulics, operations]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: '1.13'
      - uses: julia-actions/cache@v3.4.0
        with:
          delete-old-caches: false
      - name: Instantiate
        run: julia --pkgimages=no --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run hydraulic examples
        if: matrix.group == 'hydraulics'
        run: >-
          julia --pkgimages=no --project=. scripts/run_examples.jl
          examples/single_reservoir.jl examples/level_channels.jl
          examples/tunnel_gates.jl examples/shared_tailrace.jl
          examples/river_splits.jl examples/directional_interlocks.jl
      - name: Run operating examples
        if: matrix.group == 'operations'
        run: >-
          julia --pkgimages=no --project=. scripts/run_examples.jl
          examples/turbine_tables.jl examples/unequal_turbine_grids.jl
          examples/pumped_storage.jl examples/fixed_speed_pumping.jl
          examples/soft_limits.jl examples/spinning_reserves.jl
          examples/terminal_value.jl
