name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      JULIA_NUM_THREADS: 1
      JULIA_NUM_PRECOMPILE_TASKS: 2
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: '1.13'
      - uses: julia-actions/cache@v3.4.0
        with:
          delete-old-caches: false
      - name: Instantiate and test
        run: julia --pkgimages=no --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test(; julia_args=["--pkgimages=no"])'
      - name: Test the dataset importer
        run: python3 -m unittest discover -s examples/tokke_vinje -p "test_*.py"
      - name: Run the public example
        run: julia --pkgimages=no --project=. examples/single_reservoir.jl
      - name: Run the hydraulic response example
        run: julia --pkgimages=no --project=. examples/level_channels.jl
      - name: Run the tunnel gate example
        run: julia --pkgimages=no --project=. examples/tunnel_gates.jl
      - name: Run the shared-tailrace example
        run: julia --pkgimages=no --project=. examples/shared_tailrace.jl
      - name: Run the single-head turbine example
        run: julia --pkgimages=no --project=. examples/turbine_tables.jl
      - name: Run the unequal turbine-grid example
        run: julia --pkgimages=no --project=. examples/unequal_turbine_grids.jl
      - name: Run the prescribed river-split example
        run: julia --pkgimages=no --project=. examples/river_splits.jl
      - name: Run the directional interlock example
        run: julia --pkgimages=no --project=. examples/directional_interlocks.jl
      - name: Run the pumped-storage example
        run: julia --pkgimages=no --project=. examples/pumped_storage.jl
      - name: Run the fixed-speed pump example
        run: julia --pkgimages=no --project=. examples/fixed_speed_pumping.jl
      - name: Run the soft-limit example
        run: julia --pkgimages=no --project=. examples/soft_limits.jl
      - name: Run the spinning-reserve example
        run: julia --pkgimages=no --project=. examples/spinning_reserves.jl
      - name: Run the terminal water-value example
        run: julia --pkgimages=no --project=. examples/terminal_value.jl
