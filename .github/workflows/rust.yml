name: Rust
on:
  push:
    branches: [main]
    paths: ['Cargo.*', 'rust-toolchain.toml', 'flake.*', 'crates/**', 'python/**', 'pyproject.toml', 'examples/rust/**', '.github/workflows/rust.yml']
  pull_request:
    paths: ['Cargo.*', 'rust-toolchain.toml', 'flake.*', 'crates/**', 'python/**', 'pyproject.toml', 'examples/rust/**', '.github/workflows/rust.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v32.0.0
      - uses: nix-community/cache-nix-action@v7.0.2
        with:
          primary-key: rust-${{ runner.os }}-${{ hashFiles('flake.lock', 'rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-prefixes-first-match: rust-${{ runner.os }}-${{ hashFiles('flake.lock', 'rust-toolchain.toml', 'Cargo.lock') }}-
          paths: target
      - name: Format
        run: nix develop .#rust -c cargo fmt --all --check
      - name: Clippy
        run: nix develop .#rust -c cargo clippy --workspace --all-targets -- -D warnings
      - name: Physical and derivative tests
        run: nix develop .#rust -c cargo nextest run -p openshop
      - name: Connected watercourse
        run: nix develop .#rust -c cargo run -p openshop --example schedule -- examples/rust/cascade.json 10 > "$RUNNER_TEMP/schedule.json"
      - name: Build Python wheel
        run: nix develop .#rust -c maturin build --profile dev --interpreter python3 --auditwheel repair --out target/wheels
      - name: Install Python wheel
        run: nix develop .#rust -c python3 -m pip install --no-deps --target target/python --upgrade target/wheels/openshop-*.whl
      - name: Python behavior tests
        run: nix develop .#rust -c env -u DYLD_LIBRARY_PATH -u LD_LIBRARY_PATH PYTHONPATH=target/python python3 -m pytest -q python/tests
