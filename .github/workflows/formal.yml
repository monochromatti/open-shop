name: Model proofs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: test/formal
          build: true
          build-args: --wfail
      - name: Check proof axioms
        working-directory: test/formal
        run: lake env lean CheckAxioms.lean
