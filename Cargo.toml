[workspace]
members = ["crates/openshop", "crates/openshop-python"]
default-members = ["crates/openshop"]
resolver = "3"

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/monochromatti/open-shop"

[workspace.dependencies]
oximo = { version = "0.8", default-features = false, features = ["scip-system"] }
pounce-nl = "=0.17.0"
pounce-nlp = "=0.17.0"
pounce-rs = { version = "=0.17.0", default-features = false }
ipopt_bindgen = "0.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
pyo3 = { version = "0.30", features = ["extension-module"] }
pythonize = "0.30"

[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = true

[profile.release]
debug = "line-tables-only"
lto = "thin"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
