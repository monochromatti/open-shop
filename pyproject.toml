[build-system]
requires = ["maturin>=1.12,<2"]
build-backend = "maturin"

[project]
name = "openshop"
version = "0.9.0"
description = "Nonlinear hydropower scheduling on connected watercourses"
requires-python = ">=3.11"
license = "MIT"

[tool.maturin]
manifest-path = "crates/openshop-python/Cargo.toml"
module-name = "openshop._openshop"
python-source = "python"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
